[project]
name = "kindle-share"
version = "0.1.0"
description = "在局域网内通过 Kindle 浏览器下载电脑上的书籍"
requires-python = ">=3.11"
dependencies = ["flask>=3.1,<4", "waitress>=3.0.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache"]
